<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="volantGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="128" height="128" rx="30" fill="#090d16" stroke="rgba(6, 182, 212, 0.3)" stroke-width="2"/>
  
  <!-- Sleek Aerodynamic Wing / Verification Layers -->
  <g transform="translate(18, 20)" filter="url(#glow)">
    <!-- Top Leading Edge Blade -->
    <path d="M 12 70 L 26 26 L 76 6 L 54 22 L 24 38 Z" fill="url(#volantGrad)" opacity="0.95" />
    
    <!-- Second Wing Layer -->
    <path d="M 18 73 L 34 38 L 74 24 L 54 36 L 30 48 Z" fill="url(#volantGrad)" opacity="0.9" />
    
    <!-- Third Wing Layer -->
    <path d="M 24 76 L 40 48 L 68 40 L 52 49 L 34 57 Z" fill="url(#volantGrad)" opacity="0.85" />

    <!-- Bottom Stabilizer Blade -->
    <path d="M 30 78 L 44 57 L 60 52 L 48 60 L 36 67 Z" fill="url(#volantGrad)" opacity="0.8" />
  </g>
</svg>
